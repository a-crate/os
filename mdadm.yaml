package:
  name: mdadm
  version: 4.3
  epoch: 0
  description: a tool for managing Linux Software RAID arrays
  copyright:
    - license: GPL-2.0-only

environment:
  contents:
    packages:
      - busybox
      - build-base
      - eudev-dev

pipeline:
  - uses: fetch
    with:
      expected-sha256: 61a1c22477555364dea1862df7c3b4e8b9a53ee733bad320a45fda27dd0ed44f
      uri: https://www.kernel.org/pub/linux/utils/raid/mdadm/mdadm-${{package.version}}.tar.gz

  - uses: patch
    with:
      patches: |
        werrors.patch 
  
  - runs: make

  - runs: make install

  - uses: strip

update:
  enabled: true
  release-monitor:
    identifier: 1958

test:
  environment:

    contents:
      packages:
        - util-linux
  pipeline:
    - name: "Check mdadm version"
      runs: |
        mdadm --version
